name: Build Meitou Tracker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Checkout KenshiLib build dependencies
        uses: actions/checkout@v4
        with:
          repository: BFrizzleFoShizzle/KenshiLib_Examples_deps
          ref: master
          path: third_party/KenshiLib_deps
          lfs: true

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare build environment
        shell: pwsh
        run: |
          $deps = Join-Path $env:GITHUB_WORKSPACE "third_party/KenshiLib_deps"
          $kenshiLib = Join-Path $deps "KenshiLib"
          $boostRoot = Join-Path $env:GITHUB_WORKSPACE "third_party\boost_1_60_0"
          $boostZip = Join-Path $env:RUNNER_TEMP "boost_1_60_0.zip"
          $boostLibDir = Join-Path $boostRoot "stage\lib"

          if (!(Test-Path (Join-Path $kenshiLib "Include"))) {
            throw "KenshiLib Include directory was not found."
          }

          if (!(Test-Path (Join-Path $kenshiLib "Libraries"))) {
            throw "KenshiLib Libraries directory was not found."
          }

          if (Test-Path $boostRoot) {
            Remove-Item $boostRoot -Recurse -Force
          }

          Write-Host "Downloading complete Boost 1.60.0 source archive..."
          Invoke-WebRequest -Uri "https://archives.boost.io/release/1.60.0/source/boost_1_60_0.zip" -OutFile $boostZip

          if (!(Test-Path $boostZip)) {
            throw "Boost source archive was not downloaded: $boostZip"
          }

          $zipSize = (Get-Item $boostZip).Length
          Write-Host "Downloaded Boost archive size: $zipSize bytes"

          New-Item -ItemType Directory -Path $boostRoot -Force | Out-Null
          Expand-Archive -Path $boostZip -DestinationPath $env:RUNNER_TEMP\boost_extract -Force

          $extractedRoot = Join-Path $env:RUNNER_TEMP "boost_extract\boost_1_60_0"
          if (!(Test-Path (Join-Path $extractedRoot "bootstrap.bat"))) {
            throw "Complete Boost source archive did not contain bootstrap.bat: $extractedRoot"
          }

          Copy-Item (Join-Path $extractedRoot "*") $boostRoot -Recurse -Force

          Push-Location $boostRoot
          & cmd /c "bootstrap.bat msvc"
          if ($LASTEXITCODE -ne 0) {
            $code = $LASTEXITCODE
            Pop-Location
            throw "Boost bootstrap failed with exit code $code."
          }

          & cmd /c "b2.exe --with-system --with-thread toolset=msvc-14.3 address-model=64 architecture=x86 threading=multi variant=release link=static runtime-link=shared"
          if ($LASTEXITCODE -ne 0) {
            $code = $LASTEXITCODE
            Pop-Location
            throw "Boost build failed with exit code $code."
          }
          Pop-Location

          if (!(Test-Path $boostLibDir)) {
            throw "Boost stage\lib directory was not created: $boostLibDir"
          }

          $threadLib = Get-ChildItem $boostLibDir -Filter "libboost_thread-vc143-mt-1_60.lib" -File |
            Select-Object -First 1
          $systemLib = Get-ChildItem $boostLibDir -Filter "libboost_system-vc143-mt-1_60.lib" -File |
            Select-Object -First 1

          if (!$threadLib -or !$systemLib) {
            Write-Host "Available Boost libraries:"
            Get-ChildItem $boostLibDir -Filter "libboost*.lib" -File | Select-Object -ExpandProperty Name
            throw "Required Boost 1.60 vc143 libraries were not built."
          }

          Write-Host "Boost thread: $($threadLib.Name)"
          Write-Host "Boost system: $($systemLib.Name)"

          "KENSHILIB_DIR=$kenshiLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOST_INCLUDE_PATH=$boostRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOST_LIBRARY_PATH=$boostLibDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Release x64
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "build\"
          msbuild .\MeitouTracker.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:OutDir="$out"

      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE "build\MeitouTracker.dll"
          if (!(Test-Path $dll)) {
            throw "Build completed without producing MeitouTracker.dll"
          }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Assemble mod package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "package\Meitou Tracker"
          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\Meitou Tracker.mod" $packageRoot
          Copy-Item "$env:GITHUB_WORKSPACE\RE_Kenshi.json" $packageRoot
          Copy-Item "$env:GITHUB_WORKSPACE\build\MeitouTracker.dll" $packageRoot

          $zip = Join-Path $env:GITHUB_WORKSPACE "MeitouTracker.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }
          Compress-Archive -Path $packageRoot -DestinationPath $zip -Force
          Get-ChildItem $packageRoot | Format-Table Name,Length
          Get-Item $zip | Format-List FullName,Length

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: MeitouTracker
          path: MeitouTracker.zip
          if-no-files-found: error
