name: Build Meitou Tracker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Checkout KenshiLib build dependencies
        uses: actions/checkout@v4
        with:
          repository: BFrizzleFoShizzle/KenshiLib_Examples_deps
          ref: master
          path: third_party/KenshiLib_deps
          lfs: true

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare build environment
        shell: pwsh
        run: |
          $deps = Join-Path $env:GITHUB_WORKSPACE "third_party/KenshiLib_deps"
          $kenshiLib = Join-Path $deps "KenshiLib"
          $boostRoot = Join-Path $env:GITHUB_WORKSPACE "third_party\boost_1_60_0"
          $boostInstaller = Join-Path $env:RUNNER_TEMP "boost_1_60_0-msvc-14.0-64.exe"
          $boostLibDir = Join-Path $boostRoot "lib64-msvc-14.0"

          if (!(Test-Path (Join-Path $kenshiLib "Include"))) {
            throw "KenshiLib Include directory was not found."
          }

          if (!(Test-Path (Join-Path $kenshiLib "Libraries"))) {
            throw "KenshiLib Libraries directory was not found."
          }

          if (Test-Path $boostRoot) {
            Remove-Item $boostRoot -Recurse -Force
          }

          Write-Host "Downloading the official Boost 1.60.0 MSVC 14.0 x64 binary package..."
          & curl.exe -L --fail --retry 3 --retry-delay 2 "https://sourceforge.net/projects/boost/files/boost-binaries/1.60.0/boost_1_60_0-msvc-14.0-64.exe/download" -o $boostInstaller
          if ($LASTEXITCODE -ne 0) {
            $code = $LASTEXITCODE
            throw "Boost binary package download failed with exit code $code."
          }

          if (!(Test-Path $boostInstaller)) {
            throw "Boost binary package was not downloaded: $boostInstaller"
          }

          New-Item -ItemType Directory -Path $boostRoot -Force | Out-Null
          & 7z x $boostInstaller "-o$boostRoot" -y
          if ($LASTEXITCODE -ne 0) {
            $code = $LASTEXITCODE
            throw "Boost binary package extraction failed with exit code $code."
          }

          $boostInclude = Get-ChildItem $boostRoot -Filter "unordered_map.hpp" -Recurse -File |
            Where-Object { $_.FullName -match "\\boost\\unordered_map\.hpp$" } |
            Select-Object -First 1

          if (!$boostInclude) {
            throw "Boost 1.60 headers were not found after extracting the binary package."
          }

          $boostIncludeRoot = $boostInclude.Directory.Parent.FullName
          $libRoot = Get-ChildItem $boostRoot -Directory -Filter "lib64-msvc-14.0" -Recurse |
            Select-Object -First 1
          if ($libRoot) {
            $boostLibDir = $libRoot.FullName
          }

          if (!(Test-Path $boostLibDir)) {
            throw "Boost 1.60 x64 library directory was not found: $boostLibDir"
          }

          $threadLib = Get-ChildItem $boostLibDir -Filter "libboost_thread-vc140-mt-1_60.lib" -File |
            Select-Object -First 1
          $systemLib = Get-ChildItem $boostLibDir -Filter "libboost_system-vc140-mt-1_60.lib" -File |
            Select-Object -First 1

          if (!$threadLib -or !$systemLib) {
            Write-Host "Available Boost libraries:"
            Get-ChildItem $boostLibDir -Filter "*boost*.lib" -File | Select-Object -ExpandProperty Name
            throw "Required Boost 1.60 MSVC 14.0 x64 libraries were not found."
          }

          Write-Host "Boost include root: $boostIncludeRoot"
          Write-Host "Boost library directory: $boostLibDir"
          Write-Host "Boost thread: $($threadLib.Name)"
          Write-Host "Boost system: $($systemLib.Name)"

          "KENSHILIB_DIR=$kenshiLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOST_INCLUDE_PATH=$boostIncludeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOST_LIBRARY_PATH=$boostLibDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Release x64
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "build\"
          msbuild .\MeitouTracker.vcxproj /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:OutDir="$out"

      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE "build\MeitouTracker.dll"
          if (!(Test-Path $dll)) {
            throw "Build completed without producing MeitouTracker.dll"
          }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Assemble mod package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "package\Meitou Tracker"
          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\Meitou Tracker.mod" $packageRoot
          Copy-Item "$env:GITHUB_WORKSPACE\RE_Kenshi.json" $packageRoot
          Copy-Item "$env:GITHUB_WORKSPACE\build\MeitouTracker.dll" $packageRoot

          $zip = Join-Path $env:GITHUB_WORKSPACE "MeitouTracker.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }
          Compress-Archive -Path $packageRoot -DestinationPath $zip -Force
          Get-ChildItem $packageRoot | Format-Table Name,Length
          Get-Item $zip | Format-List FullName,Length

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: MeitouTracker
          path: MeitouTracker.zip
          if-no-files-found: error
